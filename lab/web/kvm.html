<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KVM (Lab)</title>
<style>
  html, body { margin:0; height:100%; background:#2b2f36; font-family:"Segoe UI", system-ui, sans-serif; }
  #bar { background:#1f2a3a; color:#cfd8e3; display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:13px; }
  #bar b { color:#fff; margin-right:10px; } #bar .sp { flex:1; }
  #bar button { background:#2b394d; color:#e6edf5; border:1px solid #3d4f69; border-radius:3px; padding:4px 10px; font:inherit; cursor:pointer; }
  #bar button:hover { background:#36506f; }
  #screen { position:absolute; top:36px; left:0; right:0; bottom:22px; background:#000; color:#c8c8c8; overflow:auto;
            font:15px/1.35 "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; padding:10px 14px; white-space:pre-wrap; word-break:break-all; outline:none; }
  #screen.post { color:#e8e8e8; }
  #nosig { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#888; font-size:20px; }
  .cur { background:#c8c8c8; color:#000; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { background:transparent; color:inherit; } }
  .bar2 { display:inline-block; width:300px; height:10px; border:1px solid #888; vertical-align:middle; } .bar2 i { display:block; height:100%; background:#3a7bd5; }
  #status { position:absolute; bottom:0; left:0; right:0; height:22px; background:#1f2a3a; color:#8fa1b5; font-size:12px; line-height:22px; padding:0 10px; }
</style>
</head>
<body>
<div id="bar"><b id="title">KVM</b>
  <button onclick="pw('on')">Power On</button><button onclick="pw('soft')">Power Off</button>
  <button onclick="pw('cycle')">Reset</button><button onclick="cad()">Ctrl+Alt+Del</button>
  <span class="sp"></span><span>Lab-Simulation</span>
</div>
<div id="screen" tabindex="0"></div>
<div id="status">Click into the screen to type.</div>
<script>
const scr = document.getElementById('screen');
let mode = null, host = '', phase = 'login', buf = '', cur = 0, lines = [], busy = false, hist = [], hpos = 0, user = '', sid = null, prm = '';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function prompt() { return phase === 'login' ? `${host} login: ` : phase === 'pass' ? 'Password: ' : prm; }
function draw() {
  if (mode === 'off') { scr.className = ''; scr.innerHTML = '<div id="nosig">No Signal</div>'; return; }
  if (mode !== 'os') return;
  let line = '';
  if (!busy) {
    const shown = phase === 'pass' ? '' : buf, c = phase === 'pass' ? 0 : cur;
    line = esc(prompt() + shown.slice(0, c)) + '<span class="cur">' + (esc(shown[c] || ' ')) + '</span>' + esc(shown.slice(c + 1));
  }
  scr.innerHTML = esc(lines.join('\n')) + (lines.length ? '\n' : '') + line;
  scr.scrollTop = scr.scrollHeight;
}
function out(...t) { for (const x of t) lines.push(...String(x).split('\n')); if (lines.length > 5000) lines = lines.slice(-5000); }
function loginScreen() { lines = ['', `Ubuntu 24.04 LTS ${host} tty1`, '']; phase = 'login'; buf = ''; cur = 0; sid = null; draw(); }
async function poll() {
  let r;
  try { r = await fetch('/api/kvm/screen'); } catch (e) { return; }
  if (r.status === 401) { scr.innerHTML = '<div id="nosig">Session expired – please log in to the BMC web interface again.</div>'; return; }
  if (r.status === 503) { scr.innerHTML = '<div id="nosig">BMC is rebooting …</div>'; mode = null; return; }
  const d = await r.json();
  if (d.mode === 'post') {
    mode = 'post'; scr.className = 'post';
    scr.innerHTML = esc(d.lines.join('\n')) + `\n\n<span class="bar2"><i style="width:${d.pct}%"></i></span>`;
  } else if (d.mode === 'os') {
    host = d.hostname; document.title = 'KVM ' + host; document.getElementById('title').textContent = 'KVM · ' + host;
    if (mode !== 'os') { mode = 'os'; scr.className = ''; loginScreen(); }
  } else { mode = 'off'; draw(); }
}
async function call(p, body) {
  const r = await fetch(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch (e) {}
  return [r.status, j];
}
async function startShell() {
  const [c, j] = await call('/api/kvm/shell/start', {});
  if (c !== 200) { out('Connection to host lost.'); loginScreen(); return; }
  sid = j.sid; prm = j.prompt; phase = 'shell';
  out(`Welcome to Ubuntu 24.04 LTS (GNU/Linux 6.8.0-45-generic x86_64)`, '', ` * Lab-Simulation. Type "help" for an overview.`, '',
      `Last login: ${new Date().toDateString()} from 10.20.0.5`);
  draw();
}
async function run(cmd) {
  busy = true; draw();
  try {
    const [c, d] = await call('/api/kvm/shell/exec', {sid, line: cmd});
    if (c === 410) { out('Session expired.'); busy = false; loginScreen(); return; }
    if (c === 409) { out('Connection to host lost.'); busy = false; mode = null; draw(); return; }
    if (d.action === 'clear') lines = [];
    if (d.output) out(d.output);
    if (d.prompt) prm = d.prompt;
    if (d.action === 'logout') { busy = false; setTimeout(loginScreen, 300); draw(); return; }
    if (d.action === 'reboot' || d.action === 'off') { busy = true; draw(); mode = null; busy = false; return; }
  } catch (e) { out('(Verbindung zum BMC unterbrochen)'); }
  busy = false; draw();
}
async function complete() {
  completing = true;
  try { await doComplete(); } finally { completing = false; const q = queue; queue = []; for (const ev of q) handleKey(ev); }
}
async function doComplete() {
  const left = buf.slice(0, cur);
  const [c, d] = await call('/api/kvm/shell/complete', {sid, line: left});
  const m = (d.matches || []);
  if (!m.length) return;
  const word = left.split(' ').pop();
  let pre = m[0];
  for (const x of m) { let k = 0; while (k < pre.length && pre[k] === x[k]) k++; pre = pre.slice(0, k); }
  if (m.length === 1) pre = m[0] + (m[0].endsWith('/') ? '' : ' ');
  if (pre.length > word.length) {
    buf = left.slice(0, left.length - word.length) + pre + buf.slice(cur); cur = left.length - word.length + pre.length;
  } else if (m.length > 1) {
    out(prompt() + buf, m.map(x => x.replace(/\/$/, '/').split('/').filter(Boolean).pop() + (x.endsWith('/') ? '/' : '')).join('  '));
  }
  draw();
}
let completing = false, queue = [];
scr.addEventListener('keydown', e => {
  if (mode === 'os' && !busy && completing) { e.preventDefault(); queue.push({key: e.key, ctrlKey: e.ctrlKey, altKey: e.altKey, metaKey: e.metaKey, preventDefault() {}}); return; }
  handleKey(e);
});
function handleKey(e) {
  if (mode !== 'os' || busy) { if (e.key.length === 1 || e.key === 'Enter') e.preventDefault(); return; }
  const k = e.key, ctrl = e.ctrlKey && !e.altKey;
  const ins = t => { buf = buf.slice(0, cur) + t + buf.slice(cur); cur += t.length; };
  if (ctrl && k === 'l') { e.preventDefault(); lines = []; return draw(); }
  if (ctrl && k === 'c') { e.preventDefault(); out(prompt() + (phase === 'pass' ? '' : buf) + '^C'); buf = ''; cur = 0; return draw(); }
  if (ctrl && k === 'd') { e.preventDefault(); if (phase === 'shell' && !buf) run('exit'); return; }
  if (ctrl && k === 'a') { e.preventDefault(); cur = 0; return draw(); }
  if (ctrl && k === 'e') { e.preventDefault(); cur = buf.length; return draw(); }
  if (ctrl && k === 'u') { e.preventDefault(); buf = buf.slice(cur); cur = 0; return draw(); }
  if (ctrl && k === 'k') { e.preventDefault(); buf = buf.slice(0, cur); return draw(); }
  if (ctrl && k === 'w') { e.preventDefault(); const l = buf.slice(0, cur).replace(/\S+\s*$/, ''); buf = l + buf.slice(cur); cur = l.length; return draw(); }
  if (k === 'Tab') { e.preventDefault(); if (phase === 'shell') complete(); return; }
  if (k === 'Enter') {
    e.preventDefault();
    const val = buf; buf = ''; cur = 0;
    if (phase === 'login') { out(prompt() + val); if (val.trim()) { user = val.trim(); phase = 'pass'; } return draw(); }
    if (phase === 'pass') {
      out('Password: ');
      if (user !== 'root' || !val) { out('', 'Login incorrect', ''); phase = 'login'; return draw(); }
      return startShell();
    }
    out(prompt() + val);
    if (val.trim()) { hist.push(val); hpos = hist.length; run(val); } else draw();
    return;
  }
  if (k === 'Backspace') { e.preventDefault(); if (cur > 0) { buf = buf.slice(0, cur - 1) + buf.slice(cur); cur--; } return draw(); }
  if (k === 'Delete') { e.preventDefault(); buf = buf.slice(0, cur) + buf.slice(cur + 1); return draw(); }
  if (k === 'ArrowLeft') { e.preventDefault(); cur = Math.max(0, cur - 1); return draw(); }
  if (k === 'ArrowRight') { e.preventDefault(); cur = Math.min(buf.length, cur + 1); return draw(); }
  if (k === 'Home') { e.preventDefault(); cur = 0; return draw(); }
  if (k === 'End') { e.preventDefault(); cur = buf.length; return draw(); }
  if (k === 'ArrowUp' && phase === 'shell') { e.preventDefault(); if (hpos > 0) { buf = hist[--hpos]; cur = buf.length; } return draw(); }
  if (k === 'ArrowDown' && phase === 'shell') { e.preventDefault(); hpos = Math.min(hist.length, hpos + 1); buf = hist[hpos] || ''; cur = buf.length; return draw(); }
  if (k.length === 1 && !e.ctrlKey && !e.metaKey) { e.preventDefault(); ins(k); draw(); }
}
scr.addEventListener('paste', e => { if (mode === 'os' && !busy) { const t = (e.clipboardData.getData('text') || '').replace(/\r?\n/g, ' '); buf = buf.slice(0, cur) + t + buf.slice(cur); cur += t.length; draw(); e.preventDefault(); } });
async function pw(action) {
  if (action !== 'on' && !confirm('Really ' + action + '?')) return;
  await call('/api/power', {action});
  mode = null; poll();
}
function cad() { if (mode === 'os' && confirm('Send Ctrl+Alt+Del (reboot)?')) pw('cycle'); }
scr.focus(); poll(); setInterval(poll, 1500);
</script>
</body>
</html>
